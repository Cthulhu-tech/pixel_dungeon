<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pixel Dungeon — port infrastructure test</title>
<style>body{margin:0;background:#151515;display:grid;place-items:center;min-height:100vh}canvas{image-rendering:pixelated}#game{width:320px;height:240px}</style></head>
<body><div id="game"></div><script type="module">
import { mountApplication } from '/src/main.ts';
const host = document.getElementById('game');
if (host === null) throw new Error('Missing application host');
const application = mountApplication(host);
if (import.meta.hot) import.meta.hot.dispose(() => application.dispose());
</script></body></html>
