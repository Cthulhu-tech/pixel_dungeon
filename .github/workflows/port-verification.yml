name: Port verification (no browser)

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'tools/port/oracle/**'
      - 'tests/reference/**'
      - '.github/workflows/port-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: port-verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kernel:
    name: Independent Java and headless contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Record actual tools
        run: |
          node --version
          npm --version
          javac --version
      - name: Compare selected kernel to original Java
        run: npm run test:kernel
      - name: Exercise general contract entry
        run: npm run test:contracts
      - name: Check contract runner regression
        run: node --test tools/contracts-entrypoint.test.mjs
      - name: Test registry audit without network fixtures
        run: node --test tools/audit-dependency-pins.test.mjs

  dependencies:
    name: Registry pins and application compilation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Verify actual registry records, never substitute versions
        run: npm run audit:dependencies
      - name: Publish the registry report even on failure
        if: always()
        run: |
          if [ -f ../tmp/dependency-pins.json ]; then
            echo '## Dependency pin availability (not runtime parity)' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat ../tmp/dependency-pins.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Resolve dependencies without install scripts or browsers
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Capture exact offline debugging inputs without credentials or untracked files
        run: |
          mkdir -p ../tmp
          git bundle create ../tmp/port-source.bundle HEAD
          tar -czf ../tmp/port-dependencies.tar.gz node_modules package-lock.json
          git rev-parse HEAD > ../tmp/port-source-commit.txt
          sha256sum ../tmp/port-source.bundle ../tmp/port-dependencies.tar.gz > ../tmp/port-inputs.sha256
      - name: Retain source and resolved packages for this compilation attempt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: port-debug-inputs-${{ github.sha }}
          path: |
            tmp/port-source.bundle
            tmp/port-dependencies.tar.gz
            tmp/port-source-commit.txt
            tmp/port-inputs.sha256
            tmp/dependency-pins.json
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: Record actual checkout and compiler configuration
        run: |
          pwd
          git rev-parse HEAD
          git hash-object tsconfig.json
          cat tsconfig.json
          node -p "require('typescript/package.json').version"
          node node_modules/typescript/bin/tsc --project tsconfig.json --showConfig
      - name: Typecheck and extract character owners with the installed compiler
        run: |
          npm run typecheck:character
          npm run check:extraction:character
      - name: Typecheck and extract movement, effects and shared grid
        run: |
          npm run typecheck:movement
          npm run typecheck:effects
          npm run typecheck:kernel
          npm run check:extraction:movement
          npm run check:extraction:effects
          npm run check:extraction:kernel
      - name: Typecheck and build without opening a browser
        run: npm run build
      - name: Check current architecture gate
        run: npm run check:boundaries
      - name: Verify isolated owners using the installed compiler
        run: |
          npm run check:extraction:compatibility
          npm run check:extraction:turns
      - name: Diagnose alternative published declarations without changing application pins
        if: always() && hashFiles('web/node_modules/typescript/bin/tsc') != ''
        run: node tools/probe-dependency-types.mjs
      - name: Retain dependency type investigation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: port-type-probe-${{ github.sha }}
          path: |
            tmp/dependency-type-probe.json
            tmp/compatible-probe-inputs.tar.gz
          retention-days: 1
          if-no-files-found: warn
